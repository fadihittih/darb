<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Data owners</title>
  <meta name="description" content="Sign-in for transport operators and reserves to update their own schedules and prices on Darb.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
</head>
<body>
  <header id="nav"></header>

  <main id="main" class="page">
    <div class="container admin">
      <div class="admin-head">
        <div class="admin-intro">
          <h1 class="admin-title">Data owners</h1>
          <p class="muted admin-sub">JETT, PDTRA and reserves update their own schedules and prices. Every change is dated and shown on the dashboard.</p>
        </div>
        <section class="card admin-auth" id="auth" aria-live="polite" aria-busy="true"></section>
      </div>
      <section id="gate" aria-live="polite"></section>
      <div id="console" class="admin-console"></div>
    </div>
  </main>

  <footer id="footer"></footer>
  <script type="module" src="/js/pages/admin.js"></script>

</html>
